[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit INA219 @ ^1.2.3
    adafruit/Adafruit BusIO @ ^1.16.1
    Wire
    SPI

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLORA_SCK=18
    -DLORA_MISO=19
    -DLORA_MOSI=23
    -DLORA_SS=5
    -DLORA_RST=14
    -DLORA_DIO0=2
    -DLORA_BAND=868E6
    -DBLE_DEVICE_NAME=\"AgriX-SolarGateway\"
