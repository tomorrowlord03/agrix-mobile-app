[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    4-20ma/ModbusMaster @ ^2.0.1
    SPI

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLORA_SCK=18
    -DLORA_MISO=19
    -DLORA_MOSI=23
    -DLORA_SS=5
    -DLORA_RST=14
    -DLORA_DIO0=2
    -DLORA_BAND=868E6
